<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Nocapps</title>
    <script>
      // SPA redirect for GitHub Pages: encodes the current path into a query
      // string and redirects to index.html, which then restores the path.
      // segmentCount = 0 for root deployment (no base path segment).
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search
            ? "&" + l.search.slice(1).replace(/&/g, "~and~")
            : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
